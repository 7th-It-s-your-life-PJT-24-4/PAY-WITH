services:
  web:
    # CI 는 GHCR 에 올린 이미지를 WEB_IMAGE 로 넘겨 그대로 띄우고(--no-build), 수동 배포는
    # build 로 직접 만든다. 셸 환경변수가 .env 보다 우선하므로 CI 가 넘긴 값이 이긴다.
    image: ${WEB_IMAGE:-pay-with-web:local}
    build:
      context: ../fe
      args:
        VITE_API_BASE_URL: /api
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      # certbot 은 호스트에 설치해 두고, 발급물만 컨테이너에 읽기 전용으로 넘긴다.
      # certbot 이 챌린지 파일을 쓰는 곳. Nginx 가 /.well-known/acme-challenge/ 로 서빙한다.
      - /var/www/certbot:/var/www/certbot:ro
      # 인증서. 실제 파일은 archive 에 있고 live 는 심볼릭 링크라 상위 디렉터리째 마운트해야 한다.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 설정을 이미지에 굽지 않고 마운트한다. HTTPS 전환처럼 conf 만 고칠 때 프런트 재빌드
      # (pnpm install + vite build) 없이 nginx -s reload 로 끝낸다.
      - ../fe/apps/web/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # 80 은 443 으로 리다이렉트하지만 계속 열어 둔다. Let's Encrypt 갱신 검증이
      # 평문 HTTP 로 들어오기 때문이다.
      - '80:80'
      - '443:443'

  app:
    image: ${APP_IMAGE:-pay-with-api:local}
    build:
      context: ../be
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # DB 는 RDS 를 쓴다. sslMode 로 전송 구간을 암호화하므로 allowPublicKeyRetrieval 은
      # 필요 없다(TLS 없이 서버 공개키를 평문으로 받아오는 옵션). useSSL 은 Connector/J
      # 8.0.13 부터 deprecated 라 쓰지 않는다.
      # REQUIRED 는 암호화만 강제하고 서버 인증서는 검증하지 않는다. 검증까지 하려면
      # VERIFY_IDENTITY 로 올리고 RDS CA 번들을 트러스트스토어에 넣어야 한다.
      DB_URL: "jdbc:mysql://${RDS_ENDPOINT}:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PAIRING_INVITE_BASE_URL: ${PAIRING_INVITE_BASE_URL}
      FCM_ENABLED: ${FCM_ENABLED:-true}
      FCM_CREDENTIALS_PATH: /etc/paywith/firebase-service-account.json
    volumes:
      # Firebase 서비스 계정 키. 이미지에 굽지 않는다 — GHCR 은 조직 밖에서도 pull 될 수 있고,
      # 이미지에 한 번 들어가면 레이어에 영구히 남는다. 배포가 덮지 않도록 deploy/.env 와 같이
      # 서버에 상주시키고(gitignore) 읽기 전용으로만 넣는다.
      #
      # 파일이 아니라 디렉터리를 마운트하는 이유는, 파일 경로를 지정했는데 서버에 그 파일이
      # 없으면 Docker 가 같은 이름의 빈 디렉터리를 만들어 원인을 찾기 어려워지기 때문이다.
      #
      # FCM_ENABLED 가 true 인데 키가 없으면 앱이 기동을 거부한다. 키를 올리기 전에 배포해야
      # 한다면 deploy/.env 에 FCM_ENABLED=false 를 먼저 넣어 둔다.
      - ./secrets:/etc/paywith:ro
    # 외부 트래픽은 Nginx 를 거치므로 8080 을 공개할 이유가 없다. 다만 Nginx 를 건너뛰고
    # 앱만 직접 확인해야 할 때가 있어(프록시 문제 격리, 디버깅) 루프백에 묶어 둔다.
    # SSH 터널로만 닿는다: ssh -N -L 8080:localhost:8080.
    # 0.0.0.0 에 열면 보안 그룹만이 유일한 방어선이 된다.
    ports:
      - '127.0.0.1:8080:8080'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
