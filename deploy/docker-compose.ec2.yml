services:
  web:
    build:
      context: ../fe
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'

  app:
    build:
      context: ../be
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TZ: Asia/Seoul
      # DB 는 RDS 를 쓴다. sslMode 로 전송 구간을 암호화하므로 allowPublicKeyRetrieval 은
      # 필요 없다(TLS 없이 서버 공개키를 평문으로 받아오는 옵션). useSSL 은 Connector/J
      # 8.0.13 부터 deprecated 라 쓰지 않는다.
      # REQUIRED 는 암호화만 강제하고 서버 인증서는 검증하지 않는다. 검증까지 하려면
      # VERIFY_IDENTITY 로 올리고 RDS CA 번들을 트러스트스토어에 넣어야 한다.
      DB_URL: "jdbc:mysql://${RDS_ENDPOINT}:3306/${MYSQL_DATABASE}?sslMode=REQUIRED&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      PAIRING_INVITE_BASE_URL: ${PAIRING_INVITE_BASE_URL}
    expose:
      - '8080'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  redis-data:
