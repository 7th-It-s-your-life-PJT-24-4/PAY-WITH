services:
  mysql:
    image: mysql:8.4
    container_name: pay-with-mysql
    env_file:
      - .env
    ports:
      - '3306:3306'
    # 스키마는 앱이 기동하면서 Flyway 로 적용한다. initdb.d 마운트를 두면 로컬만 다른 경로로
    # 스키마가 생겨 RDS 와 반영 방식이 갈리고, initdb.d 는 데이터 디렉터리가 완전히 빈 최초
    # 기동에만 동작해서 스키마를 바꿀 때마다 볼륨을 지워야 했다.
    # → mysql 만 띄우면 DB 는 비어 있다. 테이블을 보려면 앱을 한 번 기동해야 한다.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pay-with-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pay-with-api
    env_file:
      - .env
    volumes:
      # Firebase 서비스 계정 키. 이미지에 굽지 않고 마운트로만 넣는다(GHCR 에 올라가면 안 된다).
      # 파일이 아니라 디렉터리를 마운트하는 이유는, 파일 경로를 지정했는데 호스트에 그 파일이
      # 없으면 Docker 가 같은 이름의 빈 디렉터리를 만들어 버려 더 헷갈리기 때문이다.
      # secrets/ 가 없으면 빈 디렉터리로 생성되는데, FCM_ENABLED 기본값이 false 라 읽지 않는다.
      - ./secrets:/etc/paywith:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # mysql 과 같은 시간대여야 한다. 앱은 LocalDateTime.now() 로 expired_at 을 만들고
    # 조회는 MySQL NOW() 와 비교하므로, 어긋나면 승인요청이 생성 즉시 만료로 취급된다.
    ports:
      - '8080:8080'

volumes:
  mysql-data:
