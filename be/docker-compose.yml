services:
  mysql:
    image: mysql:8.4
    container_name: pay-with-mysql
    env_file:
      - .env
    ports:
      - '3306:3306'
    # 스키마는 앱이 기동하면서 Flyway 로 적용한다. initdb.d 마운트를 두면 로컬만 다른 경로로
    # 스키마가 생겨 RDS 와 반영 방식이 갈리고, initdb.d 는 데이터 디렉터리가 완전히 빈 최초
    # 기동에만 동작해서 스키마를 바꿀 때마다 볼륨을 지워야 했다.
    # → mysql 만 띄우면 DB 는 비어 있다. 테이블을 보려면 앱을 한 번 기동해야 한다.
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pay-with-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pay-with-api
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # mysql 과 같은 시간대여야 한다. 앱은 LocalDateTime.now() 로 expired_at 을 만들고
    # 조회는 MySQL NOW() 와 비교하므로, 어긋나면 승인요청이 생성 즉시 만료로 취급된다.
    ports:
      - '8080:8080'

volumes:
  mysql-data:
