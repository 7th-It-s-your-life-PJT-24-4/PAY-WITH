services:
  mysql:
    image: mysql:8.4
    container_name: pay-with-mysql
    environment:
      MYSQL_DATABASE: pay_with
      MYSQL_USER: paywith
      MYSQL_PASSWORD: paywith
      MYSQL_ROOT_PASSWORD: root
      TZ: Asia/Seoul
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pay-with-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pay-with-api
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/pay_with?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: paywith
      DB_PASSWORD: paywith
      JWT_SECRET: local-development-secret-key-change-this-value-please-123456
      REDIS_HOST: redis
      REDIS_PORT: '6379'
    ports:
      - '8080:8080'

volumes:
  mysql-data:
