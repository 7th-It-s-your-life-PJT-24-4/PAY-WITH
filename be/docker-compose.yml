services:
  mysql:
    image: mysql:8.4
    container_name: pay-with-mysql
    env_file:
      - .env
    ports:
      - '3306:3306'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-proot']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pay-with-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: pay-with-api
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # mysql 과 같은 시간대여야 한다. 앱은 LocalDateTime.now() 로 expired_at 을 만들고
    # 조회는 MySQL NOW() 와 비교하므로, 어긋나면 승인요청이 생성 즉시 만료로 취급된다.
    ports:
      - '8080:8080'

volumes:
  mysql-data:
