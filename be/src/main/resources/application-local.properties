spring.profiles.active=local

db.driver=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/paywith?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
db.username=${DB_USERNAME:paywith}
db.password=${DB_PASSWORD:paywith}
db.pool.maximum-pool-size=${DB_POOL_MAXIMUM_POOL_SIZE:10}

jwt.secret=${JWT_SECRET:local-development-secret-key-change-this-value-please-123456}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}

# CORS 허용 origin. 와일드카드는 credential 허용과 함께 못 쓰므로 콤마로 나열한다.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

kftc.api.base-url=${KFTC_API_BASE_URL:https://testapi.openbanking.or.kr}
kftc.client-id=${KFTC_CLIENT_ID:local-dev-client-id}
kftc.client-secret=${KFTC_CLIENT_SECRET:local-dev-client-secret}

# 등급 경계 — 안전 0~24 / 주의 25~49 / 위험 50 이상. 총점은 0 하한.
fds.threshold.caution=${FDS_THRESHOLD_CAUTION:25}
fds.threshold.danger=${FDS_THRESHOLD_DANGER:50}

# 고액 구간 경계(원). L1 이상~L2 미만=HIGH_AMOUNT_L1, L2~L3 미만=L2, L3 초과=L3
fds.high-amount.l1-threshold=${FDS_HIGH_AMOUNT_L1_THRESHOLD:500000}
fds.high-amount.l2-threshold=${FDS_HIGH_AMOUNT_L2_THRESHOLD:1500000}
fds.high-amount.l3-threshold=${FDS_HIGH_AMOUNT_L3_THRESHOLD:3000000}

# 심야 구간(시). late=밤~자정 / deep=자정~새벽
fds.night.late-start-hour=${FDS_NIGHT_LATE_START_HOUR:22}
fds.night.deep-end-hour=${FDS_NIGHT_DEEP_END_HOUR:6}

fds.repeated.window-minutes=${FDS_REPEATED_WINDOW_MINUTES:30}
fds.repeated.count-threshold=${FDS_REPEATED_COUNT_THRESHOLD:3}
fds.division.window-minutes=${FDS_DIVISION_WINDOW_MINUTES:30}
fds.division.account-threshold=${FDS_DIVISION_ACCOUNT_THRESHOLD:3}

# 메모 키워드 — 하나라도 걸리면 동일 배점. AppConfig 의 @PropertySource(encoding="UTF-8") 전제.
fds.memo-keywords=${FDS_MEMO_KEYWORDS:검찰,경찰,수사,대포통장,납치,대출,벌금}


# 사기계좌 조회 목 데이터 — "은행코드:계좌번호" 형식. 실제 API 연동 시 이 설정은 제거한다.
fds.fraud-check.mock-accounts=${FDS_FRAUD_CHECK_MOCK_ACCOUNTS:088:110234567890,090:3333012345678}

# 주의 등급 이상에서 LLM 사후 분석 대상으로 삼는다(비동기, 보호자 조회용)
fds.llm.trigger-score=${FDS_LLM_TRIGGER_SCORE:25}
fds.approval.expire-minutes=${FDS_APPROVAL_EXPIRE_MINUTES:180}

# 만료 스캔 주기(ms). 만료 판정은 조회 쪽에서도 expired_at 으로 거르므로 이 값이 정확도를 정하지
# 않는다. 보류 거래를 얼마나 빨리 종결 화면으로 넘길지만 좌우한다.
fds.approval.expire-scan-ms=${FDS_APPROVAL_EXPIRE_SCAN_MS:60000}

# QR 결제 요청 만료 스캔 주기(ms). 폴링·실행 경로의 lazy 전이가 있어 이 값이 결제 차단의
# 정확도를 정하지 않는다. 방치된 PENDING 행을 얼마나 빨리 EXPIRED로 종결할지만 좌우한다.
payment.expire-scan-ms=${PAYMENT_EXPIRE_SCAN_MS:60000}

# 결제 등급 임계값. 송금(fds.threshold.*)과 분리해 둔다 — 차단이 곧 만점(100)으로 보이게 하려면
# 위험 문턱이 상한과 같아야 하는데, 송금은 최고 배점이 35라 문턱이 100이면 DANGER가 나오지 않는다.
# PAY_* 배점은 이 임계값에 맞춰 송금의 2배로 잡혀 있다(R__seed.sql 2-2). 한쪽만 바꾸면 판정이 어긋난다.
fds.payment.threshold.caution=${FDS_PAYMENT_THRESHOLD_CAUTION:50}
fds.payment.threshold.danger=${FDS_PAYMENT_THRESHOLD_DANGER:100}

# 결제 FDS — 이동 속도 단축평가 임계(km/h). 초과(엄격 부등호) 시 즉시 위험.
fds.payment.impossible-speed-kmh=${FDS_PAYMENT_IMPOSSIBLE_SPEED_KMH:300}

# 결제 고액 구간 경계(원). 송금 구간보다 낮다 — 오프라인 결제 단가 기준.
fds.payment.high-amount.l1=${FDS_PAYMENT_HIGH_AMOUNT_L1:100000}
fds.payment.high-amount.l2=${FDS_PAYMENT_HIGH_AMOUNT_L2:300000}
fds.payment.high-amount.l3=${FDS_PAYMENT_HIGH_AMOUNT_L3:500000}

# 결제 카테고리 목록 2종 — 서로소 유지(같은 코드가 겹치면 위험 업종 판정 우선). 코드 문자열은
# merchants.category_code 시드 값과 정확히 일치해야 한다(불일치 시 조용히 미발동).
fds.payment.risky-categories=${FDS_PAYMENT_RISKY_CATEGORIES:JEWELRY,ELECTRONICS,GIFT_CARD,LUXURY}
fds.payment.gift-card-categories=${FDS_PAYMENT_GIFT_CARD_CATEGORIES:CVS,MART}
fds.payment.gift-card-amount-unit=${FDS_PAYMENT_GIFT_CARD_AMOUNT_UNIT:5000}

# 분할 결제 판정 — 윈도 내 과거 상품권 의심 결제가 count-threshold 건 이상이면 분할 의심(현재 포함 3건째 발동).
fds.payment.split.window-minutes=${FDS_PAYMENT_SPLIT_WINDOW_MINUTES:30}
fds.payment.split.count-threshold=${FDS_PAYMENT_SPLIT_COUNT_THRESHOLD:2}

# 위험 업종 반복 판정 — 윈도 내 과거 위험 업종 결제가 count-threshold 건 이상이면 반복 의심(현재 포함 3건째 발동).
fds.payment.risky-repeated.window-minutes=${FDS_PAYMENT_RISKY_REPEATED_WINDOW_MINUTES:30}
fds.payment.risky-repeated.count-threshold=${FDS_PAYMENT_RISKY_REPEATED_COUNT_THRESHOLD:2}

# 페어링 초대 링크 base URL. inviteUrl = {base-url}/{code}
pairing.invite-base-url=${PAIRING_INVITE_BASE_URL:https://paywith.link}

# FCM 푸시 발송. 로컬 기본값은 꺼 둔다 — 서비스 계정 키가 있어야 켤 수 있는데 개발자마다
# 받아둘 수는 없기 때문이다. 꺼져 있으면 알림 행은 그대로 쌓이고 발송만 생략된다.
# 실제 발송을 확인하려면 키를 내려받아 경로를 지정하고 FCM_ENABLED=true 로 띄운다.
fcm.enabled=${FCM_ENABLED:false}
fcm.credentials-path=${FCM_CREDENTIALS_PATH:}

# 시연용 예금주 이름 생성 목데이터 — 계좌번호 특정 자리 숫자(0~9)를 성/이름 음절에 매핑.
# 등록 안 된 임의의 계좌번호로도 실명조회(OpenBankingClient.inquireRealName)가 그럴듯한 이름을
# 반환하도록 하기 위함. 첫 자리=성, 5번째 자리=이름 첫 음절, 마지막 자리=이름 둘째 음절.
# 실제 오픈뱅킹 API 연동이 확정되면 이 설정은 제거한다.
mock.holder-name.surnames=이,김,박,최,정,강,조,윤,장,임
mock.holder-name.given-first=서,민,지,수,윤,예,준,아,현,하
mock.holder-name.given-second=아,민,준,호,영,진,희,우,빈,서