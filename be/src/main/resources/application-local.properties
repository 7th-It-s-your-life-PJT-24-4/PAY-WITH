spring.profiles.active=local

db.driver=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/pay_with?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
db.username=${DB_USERNAME:paywith}
db.password=${DB_PASSWORD:paywith}
db.pool.maximum-pool-size=${DB_POOL_MAXIMUM_POOL_SIZE:10}

jwt.secret=${JWT_SECRET:local-development-secret-key-change-this-value-please-123456}
jwt.access-token-validity-ms=${JWT_ACCESS_TOKEN_VALIDITY_MS:1800000}
jwt.refresh-token-validity-ms=${JWT_REFRESH_TOKEN_VALIDITY_MS:1209600000}

redis.host=${REDIS_HOST:localhost}
redis.port=${REDIS_PORT:6379}

# 등급 경계 — 안전 0~24 / 주의 25~49 / 위험 50 이상. 총점은 0 하한.
fds.threshold.caution=${FDS_THRESHOLD_CAUTION:25}
fds.threshold.danger=${FDS_THRESHOLD_DANGER:50}

# 고액 구간 경계(원). L1 이상~L2 미만=HIGH_AMOUNT_L1, L2~L3 미만=L2, L3 초과=L3
fds.high-amount.l1-threshold=${FDS_HIGH_AMOUNT_L1_THRESHOLD:500000}
fds.high-amount.l2-threshold=${FDS_HIGH_AMOUNT_L2_THRESHOLD:1500000}
fds.high-amount.l3-threshold=${FDS_HIGH_AMOUNT_L3_THRESHOLD:3000000}

# 심야 구간(시). late=밤~자정 / deep=자정~새벽
fds.night.late-start-hour=${FDS_NIGHT_LATE_START_HOUR:22}
fds.night.deep-end-hour=${FDS_NIGHT_DEEP_END_HOUR:6}

fds.repeated.window-minutes=${FDS_REPEATED_WINDOW_MINUTES:30}
fds.repeated.count-threshold=${FDS_REPEATED_COUNT_THRESHOLD:3}
fds.division.window-minutes=${FDS_DIVISION_WINDOW_MINUTES:30}
fds.division.account-threshold=${FDS_DIVISION_ACCOUNT_THRESHOLD:3}

# 메모 키워드 — 하나라도 걸리면 동일 배점. AppConfig 의 @PropertySource(encoding="UTF-8") 전제.
fds.memo-keywords=${FDS_MEMO_KEYWORDS:검찰,경찰,수사,대포통장,납치,대출,벌금}


# 주의 등급 이상에서 LLM 사후 분석 대상으로 삼는다(비동기, 보호자 조회용)
fds.llm.trigger-score=${FDS_LLM_TRIGGER_SCORE:25}
fds.approval.expire-minutes=${FDS_APPROVAL_EXPIRE_MINUTES:30}
