plugins {
    id 'java'
    id 'war'
}

group = 'com.paywith'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

war {
    archiveFileName = 'pay-with-api.war'
}

jar {
    enabled = false
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

ext {
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.16'
    jacksonVersion = '2.17.3'
    jjwtVersion = '0.11.5'
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    flywayVersion = '10.20.1'
    springfoxVersion = '3.0.0'
    springDataRedisVersion = '2.7.18'
    lettuceVersion = '6.1.10.RELEASE'
    firebaseAdminVersion = '9.9.0'
    lombokVersion = '1.18.34'
    junitVersion = '5.10.2'
    junitPlatformVersion = '1.10.2'
    mockitoVersion = '5.14.2'
    assertjVersion = '3.26.3'
}

repositories {
    mavenCentral()
}

// firebase-admin 이 딸려오는 google-cloud-* 를 통해 jackson BOM(2.18.2)을 함께 들여온다.
// ObjectMapper 설정(AppConfig)과 응답 직렬화가 2.17.3 기준으로 검증돼 있어, 푸시 알림을 붙였다는
// 이유로 앱 전체의 JSON 처리 버전이 함께 움직이는 건 피한다. 모듈 간 버전이 섞이면 그것대로
// 문제라 databind 만이 아니라 jackson 계열 전체를 같은 버전으로 맞춘다. 올릴 거라면
// jacksonVersion 을 바꿔 별도로 검증하는 게 맞다.
configurations.all {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group.startsWith('com.fasterxml.jackson')) {
            details.useVersion jacksonVersion
        }
    }
}

dependencies {
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    // Flyway 10 부터 DB 별 지원이 별도 모듈로 분리되어 flyway-mysql 이 함께 필요하다.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "io.springfox:springfox-swagger2:${springfoxVersion}"
    implementation "io.springfox:springfox-swagger-ui:${springfoxVersion}"
    implementation "org.springframework.data:spring-data-redis:${springDataRedisVersion}"
    implementation "io.lettuce:lettuce-core:${lettuceVersion}"
    // FCM 발송용. 제외 두 건은 기존 라이브러리와 충돌해서 넣은 것이고, 둘 다 FCM 발송 경로에는
    // 쓰이지 않는 것들만 골랐다.
    //   - netty: Lettuce(6.1.10)가 4.1.82 를 요구하는데 4.2.13 으로 밀린다. 4.2 는 codec 모듈이
    //     쪼개진 비호환 버전이라 그대로 두면 Redis 연결이 런타임에 깨진다(송금 멱등성 키가 죽는다).
    //     firebase-admin 의 netty 는 Realtime Database 웹소켓용이고 FCM 은 google-http-client 로
    //     나가므로 무관하다. 나중에 RTDB 를 쓰게 되면 이 제외부터 풀어야 한다.
    //   - commons-logging: spring-jcl 이 org.apache.commons.logging 패키지를 그대로 제공해 같은
    //     클래스가 두 jar 에 겹친다. 빼도 httpclient 의 로깅은 spring-jcl 이 받아 SLF4J 로 넘긴다.
    //
    // google-cloud-firestore/storage 는 처음에 함께 제외했다가 되돌렸다. 안 쓰는 기능이라 안전해
    // 보이지만 그 경유로 google-http-client-jackson2 가 들어오고, FirebaseOptions 생성자가 기본
    // JsonFactory 로 JacksonFactory 를 무조건 참조해서 초기화가 NoClassDefFoundError 로 죽는다.
    // (빌더에 setJsonFactory 를 줘도 생성자 참조라 우회되지 않는다.)
    //   - jackson-dataformat-xml: 있기만 하면 Spring 이 기본 컨버터 목록에 XML 컨버터를 JSON 보다
    //     앞에 등록해, Accept: */* 요청의 응답이 XML 로 나간다. WebConfig 가 목록을 통째로
    //     대체하므로 실행 중인 앱은 무사하지만, standaloneSetup 을 쓰는 컨트롤러 테스트는 기본
    //     목록을 그대로 타서 전부 깨진다. google-cloud-storage 용이고 우리는 쓰지 않는다.
    implementation("com.google.firebase:firebase-admin:${firebaseAdminVersion}") {
        exclude group: 'io.netty'
        exclude group: 'commons-logging', module: 'commons-logging'
        exclude group: 'com.fasterxml.jackson.dataformat', module: 'jackson-dataformat-xml'
    }
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'

    // 계좌번호 매핑 시연용
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    //lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    //테스트 코드
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
    testImplementation 'org.glassfish:javax.el:3.0.0'
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.springframework.security:spring-security-test:${springSecurityVersion}"
}

test {
    useJUnitPlatform()
}
