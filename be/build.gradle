plugins {
    id 'java'
    id 'war'
}

group = 'com.paywith'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

war {
    archiveFileName = 'pay-with-api.war'
}

jar {
    enabled = false
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

ext {
    springVersion = '5.3.39'
    springSecurityVersion = '5.8.16'
    jacksonVersion = '2.17.3'
    jjwtVersion = '0.11.5'
    mybatisVersion = '3.5.16'
    mybatisSpringVersion = '2.1.2'
    flywayVersion = '10.20.1'
    springfoxVersion = '3.0.0'
    springDataRedisVersion = '2.7.18'
    lettuceVersion = '6.1.10.RELEASE'
    lombokVersion = '1.18.34'
    junitVersion = '5.10.2'
    junitPlatformVersion = '1.10.2'
    mockitoVersion = '5.14.2'
    assertjVersion = '3.26.3'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"
    implementation "org.springframework.security:spring-security-web:${springSecurityVersion}"
    implementation "org.springframework.security:spring-security-config:${springSecurityVersion}"
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"
    implementation 'com.mysql:mysql-connector-j:8.0.33'
    implementation 'com.zaxxer:HikariCP:5.1.0'
    // Flyway 10 부터 DB 별 지원이 별도 모듈로 분리되어 flyway-mysql 이 함께 필요하다.
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"
    implementation "io.springfox:springfox-swagger2:${springfoxVersion}"
    implementation "io.springfox:springfox-swagger-ui:${springfoxVersion}"
    implementation "org.springframework.data:spring-data-redis:${springDataRedisVersion}"
    implementation "io.lettuce:lettuce-core:${lettuceVersion}"
    providedCompile 'javax.servlet:javax.servlet-api:4.0.1'
    implementation 'javax.validation:validation-api:2.0.1.Final'
    implementation 'org.hibernate.validator:hibernate-validator:6.2.5.Final'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    implementation 'ch.qos.logback:logback-classic:1.5.16'
    //lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    //테스트 코드
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter:${junitVersion}"
    testImplementation "org.mockito:mockito-junit-jupiter:${mockitoVersion}"
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:${junitPlatformVersion}"
    testImplementation 'org.hamcrest:hamcrest:2.2'
    testImplementation 'com.jayway.jsonpath:json-path:2.9.0'
    testImplementation 'org.glassfish:javax.el:3.0.0'
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.springframework.security:spring-security-test:${springSecurityVersion}"
}

test {
    useJUnitPlatform()
}
