# 정식 주소는 apex(paywith.site) 하나다. www 와 평문 HTTP 는 전부 여기로 모은다.

server {
    listen 80;
    server_name paywith.site www.paywith.site;

    # Let's Encrypt(certbot --webroot) 챌린지. 호스트의 /var/www/certbot 을 마운트해 쓴다.
    # 90 일마다 도는 갱신도 이 경로로 검증하므로, 아래 리다이렉트보다 먼저 매칭돼야 한다.
    # ^~ 를 빼면 프리픽스 우선순위가 밀려 갱신이 조용히 실패한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host 를 쓰면 IP 로 들어온 요청이 https://<IP> 로 넘어가 인증서 불일치가 난다.
    # 도메인으로 고정한다.
    location / {
        return 308 https://paywith.site$request_uri;
    }
}

# www 는 리다이렉트만 한다. 리다이렉트라도 TLS 핸드셰이크가 먼저라 인증서가 필요하다
# (같은 fullchain 이 두 이름을 모두 담는다).
server {
    listen 443 ssl;
    server_name www.paywith.site;

    ssl_certificate     /etc/letsencrypt/live/paywith.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paywith.site/privkey.pem;

    return 308 https://paywith.site$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name paywith.site;

    ssl_certificate     /etc/letsencrypt/live/paywith.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paywith.site/privkey.pem;

    # certbot 의 options-ssl-nginx.conf 는 python3-certbot-nginx 를 깔아야 생긴다.
    # 여기서는 certonly --webroot 만 쓰므로 그 파일에 의존하지 않고 직접 적는다.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger 는 /api/ 밖의 경로(springfox 3 기준)를 쓰므로 위 프록시로 닿지 않는다. 그냥 두면
    # 아래 try_files 에 걸려 프런트 index.html 이 돌아간다. 정규식 location 은 프리픽스보다
    # 먼저 매칭되므로 여기서 가로챈다.
    #
    # 시연 서버라 문서를 공개해 둔다. 실사용자 데이터가 들어오거나 실제 SMS 프로바이더를 붙이면
    # (/api/auth/phone/code 가 permitAll 이라 발송 비용이 샌다) 닫아야 한다. 닫는 방법은
    # deploy/README.md 참고.
    location ~ ^/(swagger-ui|swagger-resources|webjars|v2/api-docs) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
