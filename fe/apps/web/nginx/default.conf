server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt(certbot --webroot) 챌린지. 호스트의 /var/www/certbot 을 마운트해 쓴다.
    # 아래 try_files 에 먹히면 발급도 갱신도 실패하므로 ^~ 로 우선순위를 올린다.
    # HTTPS 전환 후에도 갱신에 계속 필요하니, 80 을 443 으로 리다이렉트할 때 이 경로만은
    # 리다이렉트 대상에서 빼야 한다.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location = /api {
        return 308 /api/;
    }

    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Swagger 는 /api/ 밖의 경로(springfox 3 기준)를 쓰므로 위 프록시로 닿지 않는다. 그냥 두면
    # 아래 try_files 에 걸려 프런트 index.html 이 돌아간다. 정규식 location 은 프리픽스보다
    # 먼저 매칭되므로 여기서 가로챈다.
    #
    # 시연 서버라 문서를 공개해 둔다. 실사용자 데이터가 들어오거나 실제 SMS 프로바이더를 붙이면
    # (/api/auth/phone/code 가 permitAll 이라 발송 비용이 샌다) 닫아야 한다. 닫는 방법은
    # deploy/README.md 참고.
    location ~ ^/(swagger-ui|swagger-resources|webjars|v2/api-docs) {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
