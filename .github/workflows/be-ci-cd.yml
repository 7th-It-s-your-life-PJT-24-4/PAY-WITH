name: Backend CI/CD

# develop 은 EC2 개발·시연 서버에 대응한다. 머지되면 이미지를 만들어 GHCR 에 올리고,
# EC2 에서는 같은 compose 파일로 app 컨테이너만 교체한다.
# 특정 커밋을 원하는 시점에 올리고 싶으면 Actions 탭에서 workflow_dispatch 로 실행한다.
on:
  push:
    branches: [develop]
    paths:
      - 'be/**'
      - 'deploy/**'
      - '.github/workflows/be-ci-cd.yml'
  pull_request:
    paths:
      - 'be/**'
      - 'deploy/**'
      - '.github/workflows/be-ci-cd.yml'
  workflow_dispatch:

# 연속 머지 시 앞선 배포가 뒤 배포를 덮어쓰지 않도록 한 번에 하나만 돌린다.
# 배포는 중간에 끊으면 컨테이너가 어중간한 상태로 남을 수 있어 취소하지 않는다.
concurrency:
  group: be-ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: pay-with-api

jobs:
  build:
    runs-on: ubuntu-latest
    # 커버리지 코멘트를 PR 에 남기려면 pull-requests 쓰기 권한이 필요하다.
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: be
    # 스키마는 앱이 기동하면서 Flyway 로 적용하므로, DB 가 없으면 마이그레이션 SQL 이 CI 에서
    # 한 번도 실행되지 않는다. 그러면 깨진 마이그레이션이 초록불로 머지돼 배포 시점에 터지고,
    # MySQL 은 DDL 트랜잭션이 없어 중간까지 적용된 채 실패로 기록되면 이후 기동이 계속 막힌다.
    # RootContextSmokeTest 도 3306 이 없으면 스킵되므로 스프링 조립 검증까지 함께 꺼진다.
    # 로컬·RDS 와 같은 8.4 를 쓴다. 계정·DB 이름은 application-local.properties 의 기본값과
    # 맞춰 두어 별도 환경변수 없이 붙는다.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: paywith
          MYSQL_USER: paywith
          MYSQL_PASSWORD: paywith
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # war 만 만들고 -x test 로 넘기면 회귀를 못 잡는다. build 는 test 를 포함한다.
      - name: Build and test
        run: ./gradlew clean build
      # 스모크 테스트는 3306 이 없으면 조용히 스킵한다. MySQL 서비스가 뜨지 않거나 접속 설정이
      # 어긋나면 빌드는 그대로 초록불인 채 마이그레이션 검증만 사라진다 — 침묵이 성공처럼
      # 보이는 상태다. 실제로 실행됐는지 명시적으로 확인한다.
      - name: Verify migration smoke test actually ran
        run: |
          report=build/test-results/test/TEST-com.paywith.config.RootContextSmokeTest.xml
          if [ ! -f "$report" ]; then
            echo "::error::스모크 테스트 결과 파일이 없다. 테스트가 실행되지 않았다."
            exit 1
          fi
          skipped=$(sed -n 's/.*skipped="\([0-9]*\)".*/\1/p' "$report" | head -1)
          if [ "$skipped" != "0" ]; then
            echo "::error::스모크 테스트가 스킵됐다(skipped=$skipped). MySQL 서비스 상태를 확인할 것."
            exit 1
          fi
          echo "스모크 테스트 실행 확인 (skipped=0) — 마이그레이션이 빈 DB 에 실제로 적용됐다."
      # 첫 실행에서 만들어진 스키마 위에 한 번 더 붙인다. 이미 적용된 DB 에서 migrate 가
      # checksum validate 를 통과하고 중복 적용하지 않는지 보는 것으로, 배포 때마다 벌어지는
      # 상황이다. 어느 쪽이 어긋나도 Flyway 가 예외를 던져 이 테스트가 실패한다.
      # -x jacocoTestReport 를 빼면 안 된다. 이 스텝은 test 를 다시 돌리므로 커버리지 리포트가
      # 스모크 테스트 1건 기준으로 덮여 쓰인다(78% → 5% 수준). 재실행의 목적은 마이그레이션
      # 검증이고 커버리지는 앞선 clean build 의 것을 그대로 써야 한다. exec 파일은 어차피 덮이니
      # 이 스텝 뒤에서 리포트를 새로 만들어도 같은 함정에 걸린다.
      - name: Verify migration re-run safety
        run: ./gradlew test --tests 'com.paywith.config.RootContextSmokeTest' --rerun-tasks -x jacocoTestReport
      # 임계값 미달은 코멘트에 ❌ 로만 표시되고 잡을 실패시키지 않는다(액션이 커버리지로는
      # setFailed 를 호출하지 않는다). 목적은 차단이 아니라 리팩토링에서 테스트를 함께 옮기지
      # 않은 경우를 드러내는 것이다 — 순수 리팩토링이면 커버리지가 평평해야 정상이고, 떨어지면
      # 옮겨야 할 테스트가 남아 있다는 신호다.
      # 기준값은 도입 시점 실측(INSTRUCTION 79%)보다 낮게 잡아, 평소에는 초록으로 두고 실제로
      # 떨어졌을 때만 눈에 걸리게 한다.
      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.8.0
        with:
          paths: ${{ github.workspace }}/be/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '📊 백엔드 테스트 커버리지'
          # 푸시마다 새 코멘트를 쌓지 않고 같은 코멘트를 갱신한다(title 이 있어야 동작한다).
          update-comment: true
          min-coverage-overall: 75
          min-coverage-changed-lines: 70
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: be-test-report
          path: be/build/reports/tests/test
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # BE·FE 배포가 같은 EC2 의 ~/paywith 에서 git 조작과 compose 를 실행한다.
    # deploy/** 변경은 두 워크플로를 동시에 깨우므로 배포 단계는 저장소 전체에서 직렬화한다.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 은 이미지 경로에 소문자만 허용하는데 저장소 이름에 대문자가 섞여 있다.
      - name: Resolve image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: be
          push: true
          tags: ${{ steps.image.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # DB·JWT·Redis 설정은 EC2 의 deploy/.env 한 곳에만 둔다. 여기서 다시 넘기면 같은 값이
      # 두 곳에 존재해, 한쪽만 고쳤을 때 배포 방식에 따라 결과가 갈린다.
      # CI 가 넘기는 것은 어떤 이미지를 띄울지(APP_IMAGE)뿐이다.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_IMAGE: ${{ steps.image.outputs.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_IMAGE,DEPLOY_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/paywith
            # compose 파일과 Nginx 설정이 최신이어야 한다. deploy/.env 는 gitignore 라 덮이지 않는다.
            # 브랜치 최신 HEAD 를 받으면 빌드 중 머지된 커밋이 섞여, 이미지와 compose·
            # nginx 설정의 커밋이 어긋난다. 이미지와 같은 커밋을 그대로 체크아웃한다.
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            COMPOSE="docker compose --env-file deploy/.env -f deploy/docker-compose.ec2.yml"
            $COMPOSE pull app
            # web(프런트)은 fe 워크플로가 따로 배포한다. 여기서 건드리면 관계없는 재시작이 난다.
            $COMPOSE up -d --no-build app
            # up -d 는 컨테이너 기동만 보장한다. Spring 이 부팅에 실패해도 여기서 끝나면
            # 배포가 초록불로 남아 아무도 장애를 모른다. 앱까지 실제로 응답하는지 확인한다.
            # /healthz 는 Nginx 가 app 의 /api/health 로 프록시하며 DB 커넥션까지 검증한다.
            for i in $(seq 1 30); do
              # 80 번은 443 으로 308 리다이렉트하므로 http 로 찌르면 항상 실패한다.
              # --resolve 로 공인 도메인을 루프백에 붙여, TLS 와 Nginx 라우팅까지 실제 경로로 확인한다.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                --resolve paywith.site:443:127.0.0.1 https://paywith.site/healthz || true)
              if [ "$code" = "200" ]; then
                echo "헬스 체크 통과 (${i}회차)"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "헬스 체크 실패 — 마지막 응답 코드: ${code:-없음}"
                $COMPOSE logs --tail 100 app
                exit 1
              fi
              sleep 2
            done
            docker logout ghcr.io
            # prune -f 는 dangling 만 지운다. 커밋 SHA 태그가 붙은 옛 이미지는 남아
            # 디스크를 계속 먹으므로, 사용 중이 아니고 오래된 것까지 정리한다.
            docker image prune -af --filter 'until=168h'
