name: Frontend CI/CD

# nginx 설정은 compose 가 호스트 파일을 마운트해 쓰지만, Vue 번들은 이미지 안에 구워진다.
# 그래서 fe 변경은 반드시 이미지를 다시 만들어야 반영된다(재생성만으로는 옛 번들이 남는다).
on:
  push:
    branches: [develop]
    paths:
      - "fe/**"
      - "deploy/**"
      - ".github/workflows/fe-ci-cd.yml"
  pull_request:
    paths:
      - "fe/**"
      - "deploy/**"
      - ".github/workflows/fe-ci-cd.yml"
  workflow_dispatch:

concurrency:
  group: fe-ci-cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: pay-with-web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.8.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: fe/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm --dir fe install --frozen-lockfile
      - name: Lint
        run: pnpm --dir fe lint

      # 테스트 런타임은 Node 의 fetch 라 절대 URL 이 아니면 파싱에 실패한다(/api 로 두면
      # "Failed to parse URL from /api/..."). 브라우저 번들용 값과 용도가 다르므로 분리한다.
      # apps/web/.env 는 gitignore 라 러너에는 없어, 여기서 주지 않으면 undefined 가 된다.
      - name: Unit test
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: pnpm --dir fe test

      # 번들은 프런트와 API 가 같은 도메인이라 상대경로를 쓴다. 실제 배포 이미지는 Dockerfile
      # 의 build-arg 로 다시 주입되며, 이 산출물은 컴파일 검증용으로만 쓰고 버린다.
      - name: Build
        env:
          VITE_API_BASE_URL: /api
        run: pnpm --dir fe build

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # BE·FE 배포가 같은 EC2 의 ~/paywith 에서 git 조작과 compose 를 실행한다.
    # deploy/** 변경은 두 워크플로를 동시에 깨우므로 배포 단계는 저장소 전체에서 직렬화한다.
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # GHCR 은 이미지 경로에 소문자만 허용하는데 저장소 이름에 대문자가 섞여 있다.
      - name: Resolve image reference
        id: image
        run: echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Firebase web configuration
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.VITE_FIREBASE_VAPID_KEY }}
        run: |
          missing=0
          for name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_STORAGE_BUCKET \
            VITE_FIREBASE_MESSAGING_SENDER_ID \
            VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_VAPID_KEY
          do
            if [ -z "${!name}" ]; then
              echo "Missing repository variable: ${name}"
              missing=1
            fi
          done
          test "$missing" -eq 0

      # VITE_API_BASE_URL 은 빌드 시점에 번들에 박힌다. 프런트와 API 가 같은 도메인이라
      # 상대경로 /api 로 두면 도메인이 바뀌어도 재빌드가 필요 없다.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: fe
          push: true
          tags: ${{ steps.image.outputs.ref }}
          build-args: |
            VITE_API_BASE_URL=/api
            VITE_FIREBASE_API_KEY=${{ vars.VITE_FIREBASE_API_KEY }}
            VITE_FIREBASE_AUTH_DOMAIN=${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
            VITE_FIREBASE_PROJECT_ID=${{ vars.VITE_FIREBASE_PROJECT_ID }}
            VITE_FIREBASE_STORAGE_BUCKET=${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
            VITE_FIREBASE_MESSAGING_SENDER_ID=${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
            VITE_FIREBASE_APP_ID=${{ vars.VITE_FIREBASE_APP_ID }}
            VITE_FIREBASE_VAPID_KEY=${{ vars.VITE_FIREBASE_VAPID_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        env:
          WEB_IMAGE: ${{ steps.image.outputs.ref }}
          DEPLOY_SHA: ${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: WEB_IMAGE,DEPLOY_SHA,GHCR_USER,GHCR_TOKEN
          script: |
            set -euo pipefail
            cd ~/paywith
            # 브랜치 최신 HEAD 를 받으면 빌드 중 머지된 커밋이 섞여, 이미지와 compose·
            # nginx 설정의 커밋이 어긋난다. 이미지와 같은 커밋을 그대로 체크아웃한다.
            git fetch origin "$DEPLOY_SHA"
            git checkout --detach "$DEPLOY_SHA"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            COMPOSE="docker compose --env-file deploy/.env -f deploy/docker-compose.ec2.yml"
            $COMPOSE pull web
            # web 은 depends_on: app 이라 --no-deps 가 없으면 app 까지 재생성 대상이 된다.
            # 이 워크플로에는 APP_IMAGE 가 없어 app 이 pay-with-api:local 로 되돌아간다.
            $COMPOSE up -d --no-build --no-deps web
            # up -d 는 컨테이너 기동만 보장한다. Spring 이 부팅에 실패해도 여기서 끝나면
            # 배포가 초록불로 남아 아무도 장애를 모른다. 앱까지 실제로 응답하는지 확인한다.
            # /healthz 는 Nginx 가 app 의 /api/health 로 프록시하며 DB 커넥션까지 검증한다.
            for i in $(seq 1 30); do
              # 80 번은 443 으로 308 리다이렉트하므로 http 로 찌르면 항상 실패한다.
              # --resolve 로 공인 도메인을 루프백에 붙여, TLS 와 Nginx 라우팅까지 실제 경로로 확인한다.
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                --resolve paywith.site:443:127.0.0.1 https://paywith.site/healthz || true)
              if [ "$code" = "200" ]; then
                echo "헬스 체크 통과 (${i}회차)"
                break
              fi
              if [ "$i" = "30" ]; then
                echo "헬스 체크 실패 — 마지막 응답 코드: ${code:-없음}"
                $COMPOSE logs --tail 100 app
                exit 1
              fi
              sleep 2
            done
            docker logout ghcr.io
            # prune -f 는 dangling 만 지운다. 커밋 SHA 태그가 붙은 옛 이미지는 남아
            # 디스크를 계속 먹으므로, 사용 중이 아니고 오래된 것까지 정리한다.
            docker image prune -af --filter 'until=168h'
